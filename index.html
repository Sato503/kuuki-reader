<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>空気読みチェッカー</title>
<style>
:root{--bg:#eef1f7;--card:#fff;--ink:#1c2033;--sub:#5d647d;--ac:#3d5afe;--line:#d5daea;--ok:#12a36b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#12141e;--card:#1d2030;--ink:#eceefa;--sub:#a4abc6;--ac:#7b8dff;--line:#343a55;--ok:#3fd69a}}
:root[data-theme=dark]{--bg:#12141e;--card:#1d2030;--ink:#eceefa;--sub:#a4abc6;--ac:#7b8dff;--line:#343a55;--ok:#3fd69a}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Yu Gothic","Noto Sans JP",system-ui,sans-serif;line-height:1.6;min-height:100%}
main{max-width:560px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:30px;margin:8px 0 4px;letter-spacing:.02em}
h2{font-size:19px;margin:6px 0 10px}
.top{display:flex;justify-content:space-between;color:var(--sub);font-size:14px;font-weight:700}
.top b{color:var(--ac)}
.stage{background:#fff;border:2px solid var(--line);border-radius:18px;overflow:hidden;cursor:pointer;user-select:none}
.stage svg{display:block;width:100%;height:auto}
.tip{color:var(--sub);font-size:14px;margin:10px 2px}
button{font:inherit;font-weight:800;border:0;border-radius:14px;padding:16px;width:100%;font-size:18px;background:var(--ac);color:#fff;cursor:pointer;min-height:56px}
button:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
button.act{background:var(--ok);color:#06251a;animation:p .7s infinite alternate}
button.sub{background:var(--card);color:var(--ink);border:2px solid var(--line)}
@keyframes p{to{transform:scale(1.03)}}
@media(prefers-reduced-motion:reduce){button.act{animation:none}}
.res{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px 16px;margin-bottom:12px}
.res .big{font-size:22px;font-weight:800}
.res .big em{font-style:normal;color:var(--ac)}
.card{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:16px;margin-top:10px}
.ring{fill:none;stroke:var(--line);stroke-width:1.2}
.dat{fill:var(--ac);fill-opacity:.32;stroke:var(--ac);stroke-width:3;stroke-linejoin:round}
.lb{fill:var(--ink);font-size:14px;font-weight:800}
.vl{fill:var(--sub);font-size:12px}
.row{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding:6px 0;font-size:14px}
.row:last-child{border:0}
.rank{font-size:26px;font-weight:900;margin:2px 0}
ul{padding-left:20px;color:var(--sub);font-size:14px}
</style></head><body><main id="app"></main>
<script>
const $=s=>document.querySelector(s),cl=(v,a=0,b=1)=>Math.min(b,Math.max(a,v)),K='#3a2e2a';
const T=(x,y,s,f=K,z=10)=>`<text x="${x}" y="${y}" font-size="${z}" text-anchor="middle" fill="${f}" font-weight="700">${s}</text>`;
const B=(x,y,w,s)=>`<rect x="${x}" y="${y}" width="${w}" height="26" rx="12" fill="#fff" stroke="${K}" stroke-width="1.5"/>`+T(x+w/2,y+17,s,K,11);
const BG=c=>`<rect width="360" height="200" fill="${c}"/>`;
const sweat=x=>`<path d="M${x} -12q-5 8 0 10q5 -2 0 -10z" fill="#6ec1ff"/>`;
const P=(x,y,c,m=0,ex='')=>`<g transform="translate(${x} ${y})"><rect x="-17" y="14" width="34" height="40" rx="14" fill="${c}"/><circle r="16" fill="#ffd9b3" stroke="${K}" stroke-width="1.5"/><path d="M-16 -4Q-14 -20 0 -19Q15 -20 16 -4Q6 -12 -16 -4Z" fill="${K}"/><circle cx="-6" cy="-1" r="1.8" fill="${K}"/><circle cx="6" cy="-1" r="1.8" fill="${K}"/>${m>0?`<ellipse cy="8" rx="4" ry="${1+m*4}" fill="#b3402f"/>`:`<path d="M-4 8Q0 10 4 8" stroke="${K}" fill="none"/>`}${ex}</g>`;
const glass=(x,y)=>`<path d="M${x-8} ${y}h16l-3 20h-10z" fill="#ffc94d" stroke="${K}" stroke-width="1.5"/>`;

const S=[
{ax:'間',q:'会議で発言するタイミング',tip:'上司の話が一段落して、ほんの少し間があいた瞬間に割り込もう。早すぎても遅すぎてもNG。',btn:'発言する',dur:5,ideal:2.95,tol:1,
 adv:'沈黙の「半拍」を待てると◎',
 d:(t,c)=>{const sp=t<2.4,m=sp?Math.abs(Math.sin(t*13)):(t>3.5?.7:0);
  return BG('#fff3dc')+`<rect x="20" y="150" width="320" height="14" rx="4" fill="#c9a06a"/>`+P(70,105,'#5b7fd1',sp?m:0)+P(175,105,'#8d6bc7',t>3.5?m:0)+P(290,105,'#e4572e')+B(20,40,sp?170:40,sp?'来期の方針としてはですね…':'…')+(t>3.5&&c==null?B(130,62,80,'あの…'):'')+(c!=null?B(200,52,150,'あ、一ついいですか？'):'')+T(290,172,'あなた')}},
{ax:'協調性',q:'乾杯のタイミング',tip:'みんなのグラスが上がっていく。幹事の「乾杯！」に合わせてグラスを合わせよう。',btn:'グラスを合わせる',dur:5,ideal:3.1,tol:.9,
 adv:'周りの動きに合わせる意識を',
 d:(t,c)=>{const g=cl((t-.8)/2.2),y=150-80*(g*g*(3-2*g));
  return BG('#e9f7ee')+`<rect x="20" y="150" width="320" height="14" rx="4" fill="#b98c5a"/>`+[55,135,215].map((x,k)=>P(x,105,['#d1993b','#6bb36b','#8d6bc7'][k],t>3&&k==0?.8:0)+glass(x+26,y)).join('')+P(295,105,'#e4572e')+glass(271,c!=null?70:150)+(t>3?B(25,40,110,'かんぱーい！'):'')+(c!=null&&Math.abs(c-3.1)<.5?T(240,60,'カチン！','#c0392b',16):'')+T(295,172,'あなた')}},
{ax:'ノリ',q:'上司のダジャレに反応',tip:'オチのあと、ちょっと間をおいて上司がこちらをちらっと見る。そのあたりで愛想よく笑おう。',btn:'笑う',dur:4.5,ideal:2.1,tol:.9,
 adv:'笑いどころは「オチの少しあと」',
 d:(t,c)=>{const p=t>1.4;
  return BG('#eaf4ff')+`<rect x="20" y="150" width="320" height="14" rx="4" fill="#9db4cf"/>`+P(70,105,'#d1993b',p&&t<2.6?.8:0)+P(200,105,'#6bb36b',0,t>1.5?sweat(20):'')+P(300,105,'#e4572e')+(t>.4?B(20,40,170,p?'布団が吹っ飛んだ！':'布団が…'):'')+(t>1.5?T(215,50,'シーン…','#667',12):'')+(t>1.9&&t<2.6?T(70,172,'ちらっ（こちらを見ている）'):'')+(c!=null?B(228,62,124,'あはは！さすが〜'):'')+T(300,172,'あなた')}},
{ax:'気配り',q:'エレベーターで駆け込み客',tip:'ドアが閉まりかけている。遠くから走ってくる人に気づいたら「開」ボタンを押そう。',btn:'「開」ボタンを押す',dur:4,ideal:2.2,tol:1.2,
 adv:'視界のはしの人にも気づけると◎',
 d:(t,c)=>{const o=c!=null?1:cl(1-t/4),w=60*(1-o),rx=Math.max(255,400-(t-1)*60.4);
  return BG('#cfd8dc')+`<rect x="120" y="30" width="120" height="140" fill="#fdf3c8"/>`+P(180,112,'#5b7fd1')+(t>1?P(rx,112,'#2e86ab',.5)+(t>1.6?B(262,52,90,'待って〜！'):''):'')+`<rect x="120" y="30" width="${w}" height="140" fill="#9aa7ad" stroke="${K}"/><rect x="${240-w}" y="30" width="${w}" height="140" fill="#9aa7ad" stroke="${K}"/><rect x="114" y="24" width="132" height="146" fill="none" stroke="${K}" stroke-width="5"/><circle cx="258" cy="150" r="7" fill="${c!=null?'#ffc94d':'#aaa'}" stroke="${K}"/>`+T(258,174,'開')+T(180,190,'あなた（箱の中）')}},
{ax:'瞬発力',q:'サプライズ誕生日',tip:'部屋は真っ暗。足音が近づいて、ドアが開いた瞬間にクラッカーを鳴らそう！',btn:'クラッカーを鳴らす',dur:5,ideal:2.75,tol:.8,
 adv:'合図が来たら迷わず動こう',
 d:(t,c)=>{const o=cl((t-2.5)/.3);let s=BG('#26243b')+`<rect x="270" y="50" width="60" height="120" fill="#1a1930" stroke="#8a7d5a"/><rect x="270" y="50" width="${60*o}" height="120" fill="#ffe9a8"/>`;
  if(o>=1)s+=P(300,118,'#e4572e');
  s+=P(70,115,'#5b7fd1')+`<path d="M86 124l22-14 6 8z" fill="#ff6f91"/>`;
  if(t>1.2&&t<2.5)s+=T(180,90,'コツ… コツ…','#fff',14);
  if(c!=null)for(let i=0;i<18;i++){const a=i*2.4,r=18+i*6;s+=`<rect x="${110+Math.cos(a)*r*1.6}" y="${108+Math.sin(a)*r}" width="6" height="6" fill="${['#ff6f91','#ffd23f','#5ddcff'][i%3]}"/>`}
  return s+T(70,182,'あなた','#fff')}}
];
const app=$('#app'),svg=x=>`<svg id="sv" viewBox="0 0 360 200" role="img" aria-label="場面のイラスト">${x}</svg>`;
let i=0,R=[],raf,st,ck,run=false;
const verdict=d=>d==null?'反応なし…':Math.abs(d)<.15?'ドンピシャ！':d<0?`${Math.round(-d*1000)}ms 早かった`:`${Math.round(d*1000)}ms 遅かった`;
const score=(d,s)=>d==null?0:Math.max(0,Math.round(Math.min(1,(1-Math.abs(d)/s.tol)*1.15)*100));

function title(){app.innerHTML=`<h1>空気読みチェッカー</h1><p class="tip">5つの場面で「今だ！」の瞬間にボタンを押すだけ。マウスだけで遊べます。終わったら空気読み度をレーダーチャートで採点します。</p><div class="stage" id="st">${svg(S[0].d(1,null))}</div><p></p><button id="go">スタート</button>`;$('#go').onclick=()=>{i=0;R=[];intro()}}
function intro(){const s=S[i];app.innerHTML=`<div class="top"><span>Q${i+1} / 5</span><b>${s.ax}</b></div><h2>${s.q}</h2><div class="stage">${svg(s.d(0,null))}</div><p class="tip">${s.tip}</p><button id="go">はじめる</button>`;$('#go').onclick=start}
function start(){const s=S[i],g=$('#go');st=performance.now();ck=null;run=true;g.textContent=s.btn;g.className='act';g.onclick=hit;$('.stage').onclick=hit;loop()}
function loop(){const s=S[i],t=(performance.now()-st)/1000;if(t>=s.dur){end(null);return}$('#sv').innerHTML=s.d(t,ck);raf=requestAnimationFrame(loop)}
function hit(){if(!run)return;ck=(performance.now()-st)/1000;end(ck)}
function end(c){run=false;cancelAnimationFrame(raf);const s=S[i],d=c==null?null:c-s.ideal,sc=score(d,s);R.push({sc,d});
 $('#sv').innerHTML=s.d(c==null?s.dur:c,c);$('.stage').onclick=null;
 $('#go').outerHTML=`<div class="res"><div class="big">${verdict(d)}　<em>${sc}点</em></div></div><button id="nx">${i<4?'次の場面へ':'結果を見る'}</button>`;
 $('#nx').onclick=()=>{i++;i<5?intro():result()}}
function radar(){const cx=160,cy=150,r=105,pt=(k,v)=>{const a=-Math.PI/2+k*2*Math.PI/5;return[cx+Math.cos(a)*r*v/100,cy+Math.sin(a)*r*v/100]},ps=v=>S.map((_,k)=>pt(k,v).map(n=>n.toFixed(1)).join(',')).join(' ');
 let g=[25,50,75,100].map(v=>`<polygon class="ring" points="${ps(v)}"/>`).join('');
 S.forEach((s,k)=>{const[a,b]=pt(k,100),[lx,ly]=pt(k,126);g+=`<line class="ring" x1="${cx}" y1="${cy}" x2="${a}" y2="${b}"/><text class="lb" x="${lx}" y="${ly}" text-anchor="middle">${s.ax}</text><text class="vl" x="${lx}" y="${ly+15}" text-anchor="middle">${R[k].sc}</text>`});
 return`<svg viewBox="0 0 320 290" role="img" aria-label="空気読み度のレーダーチャート">${g}<polygon id="dat" class="dat" points="${R.map((x,k)=>pt(k,Math.max(x.sc,3)).map(n=>n.toFixed(1)).join(',')).join(' ')}" style="transform-origin:${cx}px ${cy}px;transform:scale(0);transition:transform .9s cubic-bezier(.2,.8,.2,1)"/></svg>`}
function result(){const tot=Math.round(R.reduce((a,b)=>a+b.sc,0)/5),rk=tot>=85?['空気マスター','もはや場の空気そのもの。']:tot>=70?['空気ソムリエ','場の「香り」を嗅ぎ分けられます。']:tot>=50?['ふつうの空気人','大きな失敗はしないバランス型。']:tot>=30?['マイペース星人','我が道を行く力は十分。']:['KY王','ある意味、大物です。'];
 const low=R.reduce((m,x,k)=>x.sc<R[m].sc?k:m,0);
 app.innerHTML=`<h1>結果発表</h1><div class="card"><div class="top"><span>空気読み度</span></div><div class="rank">${rk[0]}　<span style="color:var(--ac)">${tot}点</span></div><div class="tip" style="margin:0">${rk[1]}</div>${radar()}</div><div class="card">${S.map((s,k)=>`<div class="row"><span>${s.q}</span><span><b>${R[k].sc}点</b>　${verdict(R[k].d)}</span></div>`).join('')}</div><div class="card"><b>次の課題：${S[low].ax}</b><ul><li>${S[low].adv}</li></ul></div><p></p><button id="again">もう一度あそぶ</button>`;
 $('#again').onclick=title;requestAnimationFrame(()=>requestAnimationFrame(()=>{$('#dat').style.transform='scale(1)'}))}
title();
</script></body></html>
